; Qapla' — trains a char-level transformer from scratch on the ESP32-S3,
; persists the model to flash and generates text. Target: ESP32-S3 N16R8
; (16MB flash / 8MB PSRAM). License: Apache 2.0.
[env:esp32-s3-devkitc-1]
; Pinned: this is the exact platform version the published run was built with.
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; PlatformIO auto-detects the port. Uncomment and set yours if needed:
; upload_port = COM19
; monitor_port = COM19
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
build_flags =
    -O2
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    olikraus/U8g2@^2.35.19
